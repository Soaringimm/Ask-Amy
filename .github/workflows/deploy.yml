name: Deploy to Production

on:
  push:
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: false
        default: 'Manual deployment'

jobs:
  deploy:
    name: Deploy Ask-Amy
    # Fail closed until the dedicated 69 runner is registered. The residual 98
    # runner must never match this deployment lane.
    runs-on: [self-hosted, macOS, ARM64, ask-amy-69]

    steps:
      - name: 📦 Get commit info
        id: commit
        run: |
          cd /Users/jacky/apps/ask-amy
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy to server
        run: |
          cd /Users/jacky/apps/ask-amy
          bash deploy.sh

      - name: ✅ Deployment Summary
        run: |
          echo "### 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.commit.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
          echo "**Message:** ${{ steps.commit.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** http://localhost:8507" >> $GITHUB_STEP_SUMMARY

      - name: 🧪 Health Check
        run: |
          echo "Waiting 30 seconds for deployment to stabilize..."
          sleep 30

          # Check if site is accessible
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8507)
          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ Application is accessible (HTTP $HTTP_CODE)"
          else
            echo "❌ Application returned HTTP $HTTP_CODE"
            exit 1
          fi
